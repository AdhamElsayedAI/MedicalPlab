services:
  - type: web
    name: medicalplab-staging
    runtime: docker
    plan: free
    region: frankfurt
    branch: release/final-mentor-mobile-handoff
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: MEDICALPLAB_RUNTIME_MODE
        value: pilot
      - key: MEDICALPLAB_PLAB_PREVIEW_QA
        value: "1"
      - key: MEDICALPLAB_PHASE_2B_ENABLED
        value: "1"
      - key: MEDICALPLAB_ANATOMY_3D_ENABLED
        value: "1"
      - key: MEDICALPLAB_TUTOR_PROVIDER
        value: stub
      - key: MEDICALPLAB_STAGING_GATE_ENABLED
        value: "1"
      - key: STAGING_ACCESS_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
