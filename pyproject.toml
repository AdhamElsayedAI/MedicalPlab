[project]
name = "medicalplab"
version = "0.2.0"
description = "Evidence-grounded medical learning and retrieval platform."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "jsonschema==4.26.0",
    "pdfplumber==0.11.10",
    "requests==2.34.2"
]

[project.optional-dependencies]
renal-ml = [
    "torch>=2.4,<3",
    "sentence-transformers>=5,<6",
    "scikit-learn>=1.5,<2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["medicalplab*"]

[tool.pytest.ini_options]
addopts = "-o cache_dir=.pytest_local --basetemp=.pytest_temp"
