name: Deploy MedicalPlab API to Google Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'schemas/**'
      - 'main.py'
      - 'Dockerfile'
      - 'requirements.txt'
      - 'cloudbuild.yaml'
      - '.github/workflows/deploy-cloud-run.yml'
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  SERVICE_NAME: medicalplab-api
  REGION: us-central1
  ALLOWED_ORIGINS: 'https://medical-plab.vercel.app'

jobs:
  deploy:
    name: Build and Deploy to Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Google Cloud Authentication
        if: "${{ env.PROJECT_ID != '' }}"
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: "${{ env.PROJECT_ID != '' }}"
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Authorize Docker Push
        if: "${{ env.PROJECT_ID != '' }}"
        run: gcloud auth configure-docker --quiet

      - name: Build and Push Docker Image
        if: "${{ env.PROJECT_ID != '' }}"
        run: |
          IMAGE_TAG="gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          LATEST_TAG="gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ env.SERVICE_NAME }}:latest"
          docker build -t "$IMAGE_TAG" -t "$LATEST_TAG" .
          docker push "$IMAGE_TAG"
          docker push "$LATEST_TAG"

      - name: Deploy to Cloud Run
        if: "${{ env.PROJECT_ID != '' }}"
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image "gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }}" \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --timeout 300 \
            --set-env-vars ALLOWED_ORIGINS="${{ env.ALLOWED_ORIGINS }}"

      - name: Get Service URL
        if: "${{ env.PROJECT_ID != '' }}"
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --platform managed --region ${{ env.REGION }} --format "value(status.url)")
          echo "Production URL: $URL"
          curl -f "$URL/health" || exit 1
