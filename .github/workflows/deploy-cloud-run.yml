name: Deploy MedicalPlab API to Google Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'schemas/**'
      - 'Data/**'
      - 'production_main.py'
      - 'Dockerfile'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'cloudbuild.yaml'
      - '.github/workflows/deploy-cloud-run.yml'
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  SERVICE_NAME: medicalplab-api
  REGION: us-central1
  ALLOWED_ORIGINS: 'https://medical-plab.vercel.app,http://localhost:3000,http://127.0.0.1:3000'

jobs:
  deploy:
    name: Build and Deploy to Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate GCP Configuration
        run: |
          if [ -z "${{ secrets.GCP_PROJECT_ID }}" ] || [ -z "${{ secrets.GCP_SA_KEY }}" ]; then
            echo "::error::DEPLOYMENT_FAILED: GCP_PROJECT_ID or GCP_SA_KEY secret is not configured in this repository."
            echo "Deployment to Cloud Run cannot proceed without valid GCP credentials."
            echo "To configure staging, set GCP_PROJECT_ID and GCP_SA_KEY repository secrets in GitHub Settings."
            exit 1
          fi

      - name: Google Cloud Authentication
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Authorize Docker Push
        run: gcloud auth configure-docker --quiet

      - name: Build and Push Docker Image
        run: |
          IMAGE_TAG="gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          LATEST_TAG="gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ env.SERVICE_NAME }}:latest"
          docker build -t "$IMAGE_TAG" -t "$LATEST_TAG" .
          docker push "$IMAGE_TAG"
          docker push "$LATEST_TAG"

      - name: Deploy to Cloud Run Staging
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image "gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ env.SERVICE_NAME }}:${{ github.sha }}" \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 1 \
            --timeout 300 \
            --set-env-vars ALLOWED_ORIGINS="${{ env.ALLOWED_ORIGINS }}",MEDICALPLAB_RUNTIME_MODE="pilot",MEDICALPLAB_PLAB_PREVIEW_QA="1",MEDICALPLAB_PHASE_2B_ENABLED="1",MEDICALPLAB_ANATOMY_3D_ENABLED="1"

      - name: Verify Staging Deployment & Health
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --platform managed --region ${{ env.REGION }} --format "value(status.url)")
          echo "Staging Service URL: $URL"
          curl -f "$URL/health" || exit 1
          curl -f "$URL/ready" || exit 1
          curl -f "$URL/api/v1/version" || exit 1
