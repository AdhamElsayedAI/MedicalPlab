name: MedicalPlab Continuous Integration

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'docs/**'
  pull_request:
    branches:
      - main

jobs:
  backend-integration:
    name: Backend Integration Suite (23/23)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt numpy scikit-learn scipy

      - name: Bootstrap Public-Safe PLAB CI Data Root
        env:
          PYTHONPATH: "src:."
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'src')
          sys.path.insert(0, '.')
          from pathlib import Path
          from tests.plab.fixture_helper import build_test_data_root
          from medicalplab.plab.data_manifest import verify_production_data_manifest
          root = build_test_data_root(Path('/tmp/medicalplab_ci_integration'))
          report = verify_production_data_manifest(root)
          assert report.is_valid, 'Fixture manifest invalid: ' + str(report.blockers)
          assert report.chunk_count == 734, f'Expected 734 chunks, got {report.chunk_count}'
          print(f'CI data root bootstrapped: {root}')
          print(f'Manifest verified: {report.chunk_count} chunks, {report.document_count} docs')
          "

      - name: Run Cross-Module Integration Tests
        env:
          PYTHONPATH: "src:."
          MEDICALPLAB_RUNTIME_MODE: "pilot"
          MEDICALPLAB_PLAB_PREVIEW_QA: "1"
          MEDICALPLAB_PHASE_2B_ENABLED: "1"
          MEDICALPLAB_ANATOMY_3D_ENABLED: "1"
          MEDICALPLAB_DATA_ROOT: "/tmp/medicalplab_ci_integration"
        run: |
          pytest tests/integration/ -v --basetemp=/tmp/pytest_int

  mobile-contract:
    name: Mobile API Contract Certification (12/12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt numpy scikit-learn scipy

      - name: Bootstrap Public-Safe PLAB CI Data Root
        env:
          PYTHONPATH: "src:."
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'src')
          sys.path.insert(0, '.')
          from pathlib import Path
          from tests.plab.fixture_helper import build_test_data_root
          from medicalplab.plab.data_manifest import verify_production_data_manifest
          root = build_test_data_root(Path('/tmp/medicalplab_ci_mobile'))
          report = verify_production_data_manifest(root)
          assert report.is_valid, 'Fixture manifest invalid: ' + str(report.blockers)
          assert report.chunk_count == 734, f'Expected 734 chunks, got {report.chunk_count}'
          print(f'CI data root bootstrapped: {root}')
          print(f'Manifest verified: {report.chunk_count} chunks, {report.document_count} docs')
          "

      - name: Run Mobile Contract Tests
        env:
          PYTHONPATH: "src:."
          MEDICALPLAB_RUNTIME_MODE: "pilot"
          MEDICALPLAB_PLAB_PREVIEW_QA: "1"
          MEDICALPLAB_PHASE_2B_ENABLED: "1"
          MEDICALPLAB_ANATOMY_3D_ENABLED: "1"
          MEDICALPLAB_DATA_ROOT: "/tmp/medicalplab_ci_mobile"
        run: |
          pytest tests/integration/test_mobile_api_contract.py -v --basetemp=/tmp/pytest_mob

  openapi-contract-drift:
    name: OpenAPI Contract Drift Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt numpy scikit-learn scipy

      - name: Verify Contract Drift Against Reference Specification
        env:
          PYTHONPATH: "src:."
          MEDICALPLAB_RUNTIME_MODE: "pilot"
        run: |
          python Scripts/verify_mobile_contract_drift.py

  frontend-build:
    name: Frontend Production Build (Next.js 16)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        run: npm ci || npm install

      - name: Run Frontend Tests (Mentor Gate & Security)
        run: npm test

      - name: Build Next.js Application
        run: npm run build

  repository-handoff-check:
    name: Repository Handoff & Link Integrity Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit Internal Documentation Links
        run: |
          python Scripts/verify_repository_handoff.py

  render-staging-security-tests:
    name: Render Staging Security Gate Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx starlette fastapi numpy scikit-learn scipy

      - name: Run Render Staging Security Gate Tests
        env:
          PYTHONPATH: "src:."
          MEDICALPLAB_RUNTIME_MODE: "pilot"
          MEDICALPLAB_PLAB_PREVIEW_QA: "1"
          MEDICALPLAB_PHASE_2B_ENABLED: "1"
          MEDICALPLAB_ANATOMY_3D_ENABLED: "1"
        run: |
          pytest tests/staging/ -v

  docker-runtime-smoke:
    name: Docker Runtime / Free-Memory Smoke Test (512MB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Production Docker Image
        run: |
          docker build -t medicalplab-api:smoke .
          IMAGE_SIZE_BYTES=$(docker image inspect medicalplab-api:smoke --format='{{.Size}}')
          IMAGE_SIZE_MB=$((IMAGE_SIZE_BYTES / 1024 / 1024))
          echo "BACKEND_IMAGE_SIZE_MB=${IMAGE_SIZE_MB}"
          echo "BACKEND_IMAGE_SIZE_MB=${IMAGE_SIZE_MB}" >> $GITHUB_ENV

      - name: Verify No ML Model Weights in Production Image
        run: |
          docker run --rm medicalplab-api:smoke python -c "
          import sys
          for mod in ['torch', 'transformers', 'sentence_transformers', 'accelerate']:
              try:
                  __import__(mod)
                  print(f'ERROR: Unwanted module {mod} found in production image', file=sys.stderr)
                  sys.exit(1)
              except ImportError:
                  pass
          print('ML_MODEL_WEIGHTS_IN_IMAGE = NO')
          "

      - name: Run Container Under Render Free 512MB RAM Limit & Verify Health
        run: |
          # Enforce exact Render Free memory constraint (512MB RAM, 512MB swap)
          docker run -d --name test-api \
            --memory=512m \
            --memory-swap=512m \
            -p 8080:8080 \
            -e MEDICALPLAB_RUNTIME_MODE=pilot \
            -e MEDICALPLAB_PLAB_PREVIEW_QA=1 \
            -e MEDICALPLAB_PHASE_2B_ENABLED=1 \
            -e MEDICALPLAB_ANATOMY_3D_ENABLED=1 \
            -e MEDICALPLAB_TUTOR_PROVIDER=stub \
            -e MEDICALPLAB_STAGING_GATE_ENABLED=1 \
            -e STAGING_ACCESS_KEY=ci-smoke-staging-key-2026 \
            -e PORT=8080 \
            medicalplab-api:smoke

          echo "Waiting for container to report healthy..."
          HEALTHY=0
          for i in {1..30}; do
            if curl -s -f http://localhost:8080/health > /dev/null; then
              echo "Container is responsive after $i seconds"
              HEALTHY=1
              break
            fi
            sleep 1
          done

          if [ $HEALTHY -ne 1 ]; then
            echo "ERROR: Container failed to become responsive within 30 seconds"
            docker logs test-api
            exit 1
          fi

          echo "--- Testing Public /health (unauthenticated) ---"
          HEALTH_RESP=$(curl -s -f http://localhost:8080/health)
          echo "Health Response: $HEALTH_RESP"

          echo "--- Testing Staging Gate: Unauthenticated /api/v1/version must be 401 ---"
          STATUS_NO_KEY=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/v1/version)
          if [ "$STATUS_NO_KEY" -ne 401 ]; then
            echo "ERROR: Expected HTTP 401 without staging key, got $STATUS_NO_KEY"
            exit 1
          fi
          echo "Staging gate correctly returned HTTP 401 without key"

          echo "--- Testing Authenticated Endpoints with X-Staging-Key ---"
          AUTH_HEADER="X-Staging-Key: ci-smoke-staging-key-2026"
          USER_HEADER="X-User-Id: ci-smoke-learner-42"

          READY_RESP=$(curl -s -f -H "$AUTH_HEADER" http://localhost:8080/ready)
          echo "Ready Response: $READY_RESP"

          VERSION_RESP=$(curl -s -f -H "$AUTH_HEADER" http://localhost:8080/api/v1/version)
          echo "Version Response: $VERSION_RESP"

          UNI_RESP=$(curl -s -f -H "$AUTH_HEADER" http://localhost:8080/api/v1/university/subjects)
          echo "University Subjects OK"

          ADAPTIVE_RESP=$(curl -s -f -H "$AUTH_HEADER" "http://localhost:8080/api/v1/adaptive/state?learner_id=ci-smoke-learner-42")
          echo "Adaptive State OK"

          ANATOMY_RESP=$(curl -s -f -H "$AUTH_HEADER" http://localhost:8080/api/v1/anatomy/structures)
          echo "Anatomy Structures OK"

          PROGRESS_RESP=$(curl -s -f -H "$AUTH_HEADER" -H "$USER_HEADER" http://localhost:8080/api/v1/progress)
          echo "Progress OK"

          TUTOR_RESP=$(curl -s -f -H "$AUTH_HEADER" -H "Content-Type: application/json" \
            -d '{"query":"What is nephrotic syndrome?"}' http://localhost:8080/api/v1/tutor/chat)
          echo "Tutor Chat OK"

          echo "--- Measuring Peak Container RAM Usage ---"
          docker stats --no-stream test-api
          MEM_USAGE_STR=$(docker stats --no-stream --format "{{.MemUsage}}" test-api | awk '{print $1}')
          echo "RENDER_FREE_RAM_MB = 512"
          echo "MEASURED_RAM_RAW = $MEM_USAGE_STR"

          echo "--- Stopping and removing container ---"
          docker stop test-api
          docker rm test-api
          echo "DOCKER_RUNTIME_SMOKE = PASS"

  clean-checkout-local-release:
    name: Clean Checkout Local Release Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt numpy scikit-learn scipy httpx

      - name: Verify Clean Checkout Local Release
        env:
          PYTHONPATH: "src:."
        run: |
          python Scripts/verify_local_release.py
