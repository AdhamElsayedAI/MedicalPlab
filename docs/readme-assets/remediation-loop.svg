<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="auto">
  <defs>
    <linearGradient id="remBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E17" />
      <stop offset="100%" stop-color="#0D1A27" />
    </linearGradient>
    <linearGradient id="scaffoldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.15" />
    </linearGradient>
    <linearGradient id="transferGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.1" />
    </linearGradient>
    <marker id="remArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#06B6D4" />
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10B981" />
    </marker>
  </defs>

  <!-- Container -->
  <rect x="0" y="0" width="920" height="280" rx="14" fill="url(#remBg)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Grid texture -->
  <pattern id="grid4" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.5" stroke-opacity="0.3" />
  </pattern>
  <rect x="1" y="1" width="918" height="278" rx="13" fill="url(#grid4)" />

  <!-- Header -->
  <text x="36" y="34" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">REMEDIATION &amp; TRANSFER</text>
  <text x="225" y="34" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Conversational Scaffolding is Not Mastery · Held-Out Transfer is Mandatory</text>

  <!-- Stage 1: Reasoning Signal -->
  <g transform="translate(36, 60)">
    <rect width="135" height="150" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.2" />
    <circle cx="24" cy="28" r="5" fill="#06B6D4" />
    <text x="36" y="32" fill="#06B6D4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="0.5">TRIGGER</text>
    <text x="16" y="60" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700">Reasoning</text>
    <text x="16" y="78" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700">Pattern Signal</text>
    <text x="16" y="104" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5">Heuristic distractor</text>
    <text x="16" y="118" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5">confusion captured</text>
    <text x="16" y="138" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">(UNI-RENAL-001)</text>
  </g>

  <!-- Conduit: Signal -> Scaffolding -->
  <path d="M 171 135 L 205 135" fill="none" stroke="#06B6D4" stroke-width="2" marker-end="url(#remArrow)" />

  <!-- Stage 2: Bounded 3-Turn Dialogue Group (Connected) -->
  <g transform="translate(210, 60)">
    <rect width="400" height="150" rx="10" fill="url(#scaffoldGrad)" stroke="#0284C7" stroke-width="1.5" />
    <text x="16" y="25" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1">BOUNDED 3-TURN SOCRATIC SCAFFOLDING</text>
    <text x="384" y="25" text-anchor="end" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5">Max 3 Turns</text>

    <!-- Turn 1: Probe -->
    <g transform="translate(16, 40)">
      <rect width="112" height="92" rx="6" fill="#0A1828" stroke="#0284C7" stroke-width="1" />
      <text x="12" y="20" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700">TURN 1: PROBE</text>
      <text x="12" y="38" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Cognitive Probe</text>
      <text x="12" y="54" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5">"What does active</text>
      <text x="12" y="66" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5">renin cleave directly?"</text>
    </g>

    <!-- Connector 1 -> 2 -->
    <line x1="128" y1="86" x2="144" y2="86" stroke="#0284C7" stroke-width="2" />

    <!-- Turn 2: Guide -->
    <g transform="translate(144, 40)">
      <rect width="112" height="92" rx="6" fill="#0A1828" stroke="#06B6D4" stroke-width="1" />
      <text x="12" y="20" fill="#06B6D4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700">TURN 2: GUIDE</text>
      <text x="12" y="38" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Guided Hint</text>
      <text x="12" y="54" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5">Affirms hepatic origin;</text>
      <text x="12" y="66" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5">guides to nomenclature</text>
    </g>

    <!-- Connector 2 -> 3 -->
    <line x1="256" y1="86" x2="272" y2="86" stroke="#06B6D4" stroke-width="2" />

    <!-- Turn 3: Consolidate -->
    <g transform="translate(272, 40)">
      <rect width="112" height="92" rx="6" fill="#0A1828" stroke="#14B8A6" stroke-width="1" />
      <text x="12" y="20" fill="#14B8A6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700">TURN 3: SYNTHESIS</text>
      <text x="12" y="38" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Consolidate</text>
      <text x="12" y="54" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5">Synthesizes rule;</text>
      <text x="12" y="66" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5">readies transfer gate</text>
    </g>
  </g>

  <!-- Separation Barrier: Held-Out Evidence Firewall -->
  <g transform="translate(635, 50)">
    <line x1="0" y1="10" x2="0" y2="160" stroke="#F59E0B" stroke-width="2" stroke-dasharray="5 4" />
    <rect x="-42" y="75" width="84" height="20" rx="4" fill="#080E17" stroke="#F59E0B" stroke-width="1" />
    <text x="0" y="89" text-anchor="middle" fill="#F59E0B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" letter-spacing="1">TRANSFER FIREWALL</text>
  </g>

  <!-- Conduit: Scaffolding -> Transfer -->
  <path d="M 610 135 L 665 135" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#greenArrow)" />

  <!-- Stage 3: Independent Held-Out Transfer Problem (Separated) -->
  <g transform="translate(675, 60)">
    <rect width="205" height="150" rx="10" fill="url(#transferGrad)" stroke="#10B981" stroke-width="2" />
    <text x="16" y="25" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1">INDEPENDENT TRANSFER</text>
    <text x="16" y="50" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Held-Out Problem</text>
    <text x="16" y="66" fill="#A7F3D0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">UNI-RENAL-001-T</text>
    
    <g transform="translate(16, 78)">
      <rect width="173" height="34" rx="4" fill="#06281E" stroke="#10B981" stroke-width="1" />
      <circle cx="14" cy="17" r="4" fill="#10B981" />
      <text x="26" y="21" fill="#ECFDF5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700">Deterministic Backend Score</text>
    </g>
    <text x="16" y="132" fill="#6EE7B7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Transfer Demonstrated</text>
  </g>

  <!-- Footer Callout -->
  <g transform="translate(36, 226)">
    <rect width="848" height="34" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
    <text x="16" y="21" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700">PEDAGOGICAL INVARIANT:</text>
    <text x="180" y="21" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">Remediation dialogue scaffolds understanding. A held-out transfer item provides independent evidence of transfer before learner state is updated.</text>
  </g>
</svg>
