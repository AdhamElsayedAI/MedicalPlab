      <text x="12" y="20" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" letter-spacing="0.5">1. INTENT</text>
      <text x="12" y="38" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Learner Query</text>
      <text x="12" y="56" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5">Physiological</text>
      <text x="12" y="68" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5">mechanism question</text>
      <text x="12" y="84" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">Context bound</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <path d="M 143 98 L 165 98" fill="none" stroke="#38BDF8" stroke-width="1.5" marker-end="url(#coreArrow)" />

