  <!-- ==================== FOOTER INVARIANT BANNER ==================== -->
  <g transform="translate(36, 434)">
    <rect width="888" height="38" rx="6" fill="#0B131E" stroke="#1E293B" stroke-width="1" />
    <circle cx="20" cy="19" r="5" fill="#38BDF8" />
    <text x="36" y="23" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">CORE ARCHITECTURAL PRINCIPLE:</text>
    <text x="248" y="23" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">MedicalPlab uses generation as a controlled educational capability, not as an authority.</text>
