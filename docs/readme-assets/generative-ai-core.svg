        <text x="12" y="18" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700">3D SCENE ACTION</text>
        <text x="12" y="34" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">FOCUS · HIGHLIGHT · ISOLATE</text>
        <text x="12" y="46" fill="#A7F3D0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">Fixed scientific geometry</text>
