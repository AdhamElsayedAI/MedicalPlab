        <text x="12" y="18" fill="#FDE047" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700">INDEPENDENT TRANSFER</text>
        <text x="12" y="34" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Held-Out Assessment Item</text>
        <text x="12" y="46" fill="#FEF08A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">Independent transfer proof</text>
