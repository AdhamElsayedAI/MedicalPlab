    <text x="18" y="24" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">PIPELINE A · EVIDENCE-BOUND GENERATIVE REASONING</text>
    <text x="870" y="24" text-anchor="end" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Grounded Socratic Tutoring</text>

    <!-- Step 1: Learner Query -->
    <g transform="translate(18, 42)">
