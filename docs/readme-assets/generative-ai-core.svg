  <text x="280" y="34" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Generative ≠ Unconstrained · Controlled Educational Capability</text>
  <text x="924" y="34" text-anchor="end" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" letter-spacing="1">GOVERNED INTELLIGENCE</text>

  <!-- ==================== TRACK A: EVIDENCE-GROUNDED EXPLANATION PIPELINE ==================== -->
  <g transform="translate(36, 56)">
