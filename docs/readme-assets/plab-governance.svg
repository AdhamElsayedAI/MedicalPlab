<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 270" width="100%" height="auto">
  <defs>
    <linearGradient id="govBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E17" />
      <stop offset="100%" stop-color="#0E1724" />
    </linearGradient>
    <linearGradient id="activeCandidateGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.08" />
    </linearGradient>
    <marker id="govArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748B" />
    </marker>
  </defs>

  <!-- Container -->
  <rect x="0" y="0" width="880" height="270" rx="14" fill="url(#govBg)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Grid texture -->
  <pattern id="grid5" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.5" stroke-opacity="0.3" />
  </pattern>
  <rect x="1" y="1" width="878" height="268" rx="13" fill="url(#grid5)" />

  <!-- Header -->
  <text x="36" y="34" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">CLINICAL EXAM GOVERNANCE</text>
  <text x="240" y="34" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">Fail-Closed Promotion Pipeline · Candidate Items are Never Self-Approved</text>

  <!-- Stage 1: Preview QA Candidate Bank (CURRENT ACTIVE STATE) -->
  <g transform="translate(36, 56)">
    <rect width="250" height="150" rx="10" fill="url(#activeCandidateGrad)" stroke="#F59E0B" stroke-width="1.5" />
    <g transform="translate(16, 20)">
      <rect width="90" height="18" rx="4" fill="#78350F" />
      <text x="45" y="13" text-anchor="middle" fill="#FDE68A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" letter-spacing="1">ACTIVE STATE</text>
    </g>
    <text x="16" y="62" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Preview QA Candidates</text>
    <text x="16" y="82" fill="#FCD34D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">36 Candidate Questions</text>
    <text x="16" y="104" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Internal engineering review &amp;</text>
    <text x="16" y="118" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">mentor demonstration bank</text>
    <text x="16" y="138" fill="#F59E0B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700">NOT PUBLIC CLINICAL CURRICULUM</text>
  </g>

  <!-- Conduit 1 -> 2 -->
  <path d="M 286 131 L 320 131" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#govArrow)" />

  <!-- Stage 2: Clinician Review Panel Gate -->
  <g transform="translate(325, 56)">
    <rect width="250" height="150" rx="10" fill="#0B131E" stroke="#334155" stroke-width="1.2" />
    <g transform="translate(16, 20)">
      <rect width="96" height="18" rx="4" fill="#1E293B" />
      <text x="48" y="13" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" letter-spacing="1">MANDATORY GATE</text>
    </g>
    <text x="16" y="58" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Clinician Review Panel</text>
    <text x="16" y="76" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Clinical accuracy review</text>
    <text x="16" y="92" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Evidence support review</text>
    <text x="16" y="108" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Distractor/content review</text>
    <text x="16" y="124" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Golden promotion decision</text>
    <text x="16" y="142" fill="#CBD5E1" font-family="ui-monospace, monospace" font-size="8.5">GOLDEN_PROMOTION_REQUIRED = YES</text>
  </g>

  <!-- Conduit 2 -> 3 -->
  <path d="M 575 131 L 609 131" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#govArrow)" />

  <!-- Stage 3: Public Production Golden Bank -->
  <g transform="translate(614, 56)">
    <rect width="230" height="150" rx="10" fill="#0B131E" stroke="#1E293B" stroke-width="1.2" />
    <g transform="translate(16, 20)">
      <rect width="84" height="18" rx="4" fill="#064E3B" />
      <text x="42" y="13" text-anchor="middle" fill="#6EE7B7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" letter-spacing="1">FAIL-CLOSED</text>
    </g>
    <text x="16" y="62" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Golden Production</text>
    <text x="16" y="82" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">0 Released Questions</text>
    <text x="16" y="104" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Strict production fails closed</text>
    <text x="16" y="118" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">until panel promotion occurs</text>
    <text x="16" y="138" fill="#94A3B8" font-family="ui-monospace, monospace" font-size="9">PUBLIC_RELEASE_READY = NO</text>
  </g>

  <!-- Footer Indicator -->
  <g transform="translate(36, 222)">
    <rect width="808" height="32" rx="6" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
    <circle cx="18" cy="16" r="4" fill="#F59E0B" />
    <text x="32" y="20" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">GOVERNANCE TRUTH:</text>
    <text x="160" y="20" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Software cannot self-certify clinical exam questions. Until a clinician review panel completes promotion, the production exam count remains zero.</text>
  </g>
</svg>
