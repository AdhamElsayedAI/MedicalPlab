<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="mr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="mr-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#00a8ff"/>
    </linearGradient>
    <linearGradient id="mr-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7000ff"/>
      <stop offset="100%" stop-color="#b800ff"/>
    </linearGradient>
    <linearGradient id="mr-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#ff5500"/>
    </linearGradient>
    <linearGradient id="mr-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e599"/>
      <stop offset="100%" stop-color="#00b377"/>
    </linearGradient>
    <filter id="mr-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <marker id="mr-arrow-cyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#00f0ff"/>
    </marker>
    <marker id="mr-arrow-purple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b800ff"/>
    </marker>
    <marker id="mr-arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#00e599"/>
    </marker>
  </defs>

  <!-- Background Grid -->
  <rect width="1000" height="620" fill="url(#mr-bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="70" x2="1000" y2="70"/>
    <line x1="0" y1="170" x2="1000" y2="170"/>
    <line x1="0" y1="270" x2="1000" y2="270"/>
    <line x1="0" y1="370" x2="1000" y2="370"/>
    <line x1="0" y1="470" x2="1000" y2="470"/>
    <line x1="0" y1="570" x2="1000" y2="570"/>
    <line x1="200" y1="0" x2="200" y2="620"/>
    <line x1="400" y1="0" x2="400" y2="620"/>
    <line x1="600" y1="0" x2="600" y2="620"/>
    <line x1="800" y1="0" x2="800" y2="620"/>
  </g>

  <!-- Header -->
  <g id="header">
    <rect x="50" y="24" width="76" height="22" rx="11" fill="#7000ff" fill-opacity="0.2" stroke="#b800ff" stroke-width="1"/>
    <text x="88" y="39" fill="#d980ff" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.5">FUTURE</text>
    <text x="140" y="41" fill="#f0f6fc" font-size="18" font-weight="800" letter-spacing="0.5">FRONTIER MODEL ROUTER ARCHITECTURE</text>
    <text x="140" y="58" fill="#8b949e" font-size="12">Decoupled Reasoning Orchestration: Model is Replaceable — Safety Contract is Immutable</text>
  </g>

  <!-- Flow Connector Lines -->
  <!-- Learner to TutorService -->
  <path d="M 170 145 L 230 145" stroke="#00f0ff" stroke-width="2" marker-end="url(#mr-arrow-cyan)"/>
  <!-- TutorService to Model Router -->
  <path d="M 430 145 L 490 145" stroke="#00f0ff" stroke-width="2" marker-end="url(#mr-arrow-cyan)"/>
  <!-- Model Router to Frontier Models -->
  <path d="M 690 145 L 750 145" stroke="#b800ff" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#mr-arrow-purple)"/>
  <!-- Frontier Models down to Draft Response -->
  <path d="M 865 240 L 865 290 L 760 290" stroke="#b800ff" stroke-width="2" marker-end="url(#mr-arrow-purple)"/>
  <!-- Draft Response to Verification Gate -->
  <path d="M 520 290 L 460 290" stroke="#00f0ff" stroke-width="2" marker-end="url(#mr-arrow-cyan)"/>
  <!-- Verification Gate to Final Response -->
  <path d="M 220 290 L 160 290" stroke="#00e599" stroke-width="2" marker-end="url(#mr-arrow-green)"/>
  <!-- Safe Fallback Branch -->
  <path d="M 340 340 L 340 380 L 160 380" stroke="#ff5500" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#mr-arrow-purple)"/>

  <!-- Stage 1: Learner Query -->
  <g id="box-learner" transform="translate(50, 95)">
    <rect width="120" height="100" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="10" fill="#00f0ff" fill-opacity="0.15"/>
    <text x="28" y="32" fill="#00f0ff" font-size="11" font-weight="800" text-anchor="middle">1</text>
    <text x="46" y="32" fill="#8b949e" font-size="10" font-weight="700" letter-spacing="1">LEARNER</text>
    <text x="60" y="60" fill="#f0f6fc" font-size="13" font-weight="700" text-anchor="middle">Clinical Query</text>
    <text x="60" y="78" fill="#8b949e" font-size="11" text-anchor="middle">+ State Context</text>
  </g>

  <!-- Stage 2: MedicalPlab TutorService -->
  <g id="box-tutorservice" transform="translate(230, 85)">
    <rect width="200" height="120" rx="10" fill="#161b22" stroke="#00f0ff" stroke-width="1.5"/>
    <circle cx="28" cy="26" r="10" fill="#00f0ff" fill-opacity="0.2"/>
    <text x="28" y="30" fill="#00f0ff" font-size="11" font-weight="800" text-anchor="middle">2</text>
    <text x="46" y="30" fill="#00f0ff" font-size="10" font-weight="700" letter-spacing="1">TUTORSERVICE</text>
    <text x="100" y="55" fill="#f0f6fc" font-size="14" font-weight="800" text-anchor="middle">Evidence Engine</text>
    <text x="100" y="75" fill="#8b949e" font-size="11" text-anchor="middle">Hybrid BM25 + Qwen Rerank</text>
    <rect x="20" y="87" width="160" height="20" rx="4" fill="#00f0ff" fill-opacity="0.1"/>
    <text x="100" y="101" fill="#00f0ff" font-size="10" font-weight="700" text-anchor="middle">BOUNDED EVIDENCE CONTEXT</text>
  </g>

  <!-- Stage 3: Model Router -->
  <g id="box-router" transform="translate(490, 85)">
    <rect width="200" height="120" rx="10" fill="#161b22" stroke="#b800ff" stroke-width="1.5"/>
    <circle cx="28" cy="26" r="10" fill="#b800ff" fill-opacity="0.2"/>
    <text x="28" y="30" fill="#b800ff" font-size="11" font-weight="800" text-anchor="middle">3</text>
    <text x="46" y="30" fill="#d980ff" font-size="10" font-weight="700" letter-spacing="1">MODEL ROUTER</text>
    <text x="100" y="55" fill="#f0f6fc" font-size="14" font-weight="800" text-anchor="middle">Provider Abstraction</text>
    <text x="100" y="75" fill="#8b949e" font-size="11" text-anchor="middle">Schema Enforcement &amp; Budget</text>
    <rect x="20" y="87" width="160" height="20" rx="4" fill="#7000ff" fill-opacity="0.15"/>
    <text x="100" y="101" fill="#d980ff" font-size="10" font-weight="700" text-anchor="middle">PROVIDER-AGNOSTIC ADAPTER</text>
  </g>

  <!-- Stage 4: Frontier Model Providers (FUTURE / PLUG-AND-PLAY) -->
  <g id="box-providers" transform="translate(750, 75)">
    <rect width="200" height="140" rx="10" fill="#1a162b" stroke="#7000ff" stroke-width="1.5" stroke-dasharray="4,4"/>
    <rect x="130" y="8" width="58" height="16" rx="8" fill="#7000ff" fill-opacity="0.3"/>
    <text x="159" y="20" fill="#d980ff" font-size="9" font-weight="700" text-anchor="middle">FUTURE</text>
    <text x="20" y="26" fill="#b800ff" font-size="10" font-weight="700" letter-spacing="1">FRONTIER PROVIDERS</text>
    <!-- Provider Cards -->
    <rect x="16" y="38" width="168" height="24" rx="4" fill="#090d16" stroke="#30363d" stroke-width="1"/>
    <text x="100" y="54" fill="#f0f6fc" font-size="11" font-weight="600" text-anchor="middle">OpenAI Frontier Reasoning (o-series)</text>
    <rect x="16" y="68" width="168" height="24" rx="4" fill="#090d16" stroke="#30363d" stroke-width="1"/>
    <text x="100" y="84" fill="#f0f6fc" font-size="11" font-weight="600" text-anchor="middle">Claude / Gemini Multimodal API</text>
    <rect x="16" y="98" width="168" height="24" rx="4" fill="#090d16" stroke="#30363d" stroke-width="1"/>
    <text x="100" y="114" fill="#f0f6fc" font-size="11" font-weight="600" text-anchor="middle">Self-Hosted Clinical Open Weights</text>
  </g>

  <!-- Stage 5: Raw Generation Draft -->
  <g id="box-draft" transform="translate(520, 240)">
    <rect width="240" height="100" rx="10" fill="#161b22" stroke="#ff9900" stroke-width="1.5"/>
    <circle cx="28" cy="26" r="10" fill="#ff9900" fill-opacity="0.2"/>
    <text x="28" y="30" fill="#ff9900" font-size="11" font-weight="800" text-anchor="middle">4</text>
    <text x="46" y="30" fill="#ff9900" font-size="10" font-weight="700" letter-spacing="1">UNTRUSTED DRAFT</text>
    <text x="120" y="55" fill="#f0f6fc" font-size="13" font-weight="700" text-anchor="middle">Candidate Generation</text>
    <text x="120" y="73" fill="#8b949e" font-size="11" text-anchor="middle">Structured JSON Response</text>
    <text x="120" y="88" fill="#ff9900" font-size="10" font-weight="600" text-anchor="middle">⚠️ Quarantined Pending Audit</text>
  </g>

  <!-- Stage 6: Claim Verification & Evidence Gating -->
  <g id="box-verification" transform="translate(220, 240)">
    <rect width="240" height="100" rx="10" fill="#161b22" stroke="#00f0ff" stroke-width="2"/>
    <circle cx="28" cy="26" r="10" fill="#00f0ff" fill-opacity="0.2"/>
    <text x="28" y="30" fill="#00f0ff" font-size="11" font-weight="800" text-anchor="middle">5</text>
    <text x="46" y="30" fill="#00f0ff" font-size="10" font-weight="700" letter-spacing="1">VERIFICATION GATE</text>
    <text x="120" y="55" fill="#f0f6fc" font-size="13" font-weight="700" text-anchor="middle">Proposition Verification</text>
    <text x="120" y="73" fill="#8b949e" font-size="11" text-anchor="middle">NLI Grounding vs Retrieved Chunks</text>
    <text x="120" y="88" fill="#00e599" font-size="10" font-weight="600" text-anchor="middle">Deterministic Safety Boundary</text>
  </g>

  <!-- Stage 7: Final Validated Response -->
  <g id="box-response" transform="translate(50, 240)">
    <rect width="110" height="70" rx="10" fill="#0d281e" stroke="#00e599" stroke-width="2"/>
    <text x="55" y="30" fill="#00e599" font-size="10" font-weight="700" letter-spacing="1" text-anchor="middle">PASS</text>
    <text x="55" y="50" fill="#f0f6fc" font-size="12" font-weight="800" text-anchor="middle">Grounded</text>
    <text x="55" y="64" fill="#8b949e" font-size="10" text-anchor="middle">Response</text>
  </g>

  <!-- Safe Fallback Box -->
  <g id="box-fallback" transform="translate(50, 350)">
    <rect width="110" height="60" rx="10" fill="#2d120a" stroke="#ff5500" stroke-width="1.5"/>
    <text x="55" y="24" fill="#ff5500" font-size="10" font-weight="700" letter-spacing="1" text-anchor="middle">FAIL</text>
    <text x="55" y="44" fill="#ff9900" font-size="11" font-weight="700" text-anchor="middle">SAFE_FALLBACK</text>
  </g>

  <!-- Bottom Principle Banner -->
  <g id="principle-banner" transform="translate(50, 440)">
    <rect width="900" height="150" rx="12" fill="#131926" stroke="#30363d" stroke-width="1.5"/>
    <rect x="20" y="16" width="220" height="24" rx="6" fill="#00f0ff" fill-opacity="0.1" stroke="#00f0ff" stroke-opacity="0.3" stroke-width="1"/>
    <text x="130" y="32" fill="#00f0ff" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1">CORE ARCHITECTURAL PRINCIPLE</text>
    
    <text x="30" y="70" fill="#f0f6fc" font-size="18" font-weight="800" letter-spacing="0.5">"Better models should strengthen the system — not become the system."</text>
    
    <!-- Split Columns -->
    <g transform="translate(30, 90)">
      <rect width="410" height="42" rx="6" fill="#161b22" stroke="#b800ff" stroke-width="1"/>
      <text x="16" y="25" fill="#d980ff" font-size="12" font-weight="700">MODEL = REPLACEABLE</text>
      <text x="175" y="25" fill="#8b949e" font-size="11">Swap frontier reasoning APIs without schema breaks</text>
    </g>
    <g transform="translate(460, 90)">
      <rect width="410" height="42" rx="6" fill="#161b22" stroke="#00e599" stroke-width="1"/>
      <text x="16" y="25" fill="#00e599" font-size="12" font-weight="700">SAFETY CONTRACT = STABLE</text>
      <text x="215" y="25" fill="#8b949e" font-size="11">Evidence gating and verification remain immutable</text>
    </g>
  </g>
</svg>
